[package]
name = "lunmia-memory"
version = "0.1.0"
description = "Lunmia Memory - captura local con IA en tu Mac"
authors = ["Yonatan"]
edition = "2021"

[lib]
name = "lunmia_memory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = ">=2.5,<3"
tauri-plugin-global-shortcut = ">=2.3,<3"
tauri-plugin-notification = ">=2.3,<3"
tauri-plugin-autostart = ">=2.5,<3"
tauri-plugin-dialog = ">=2.4,<3"
tauri-plugin-fs = ">=2.4,<3"
tauri-plugin-os = ">=2.3,<3"
tauri-plugin-process = ">=2.3,<3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"
dotenvy = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSURL",
    "NSValue",
    "NSObject",
] }
cocoa = "0.26"
core-graphics = "0.24"
window-vibrancy = "0.6"
